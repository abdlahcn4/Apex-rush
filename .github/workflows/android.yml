name: Android APK

# Builds the Godot slice into an installable debug APK.
# Also the first place the project is executed by the real engine (headless smoke test).
#
# Artifacts are published back onto the branch under .ci-builds/ because the runner's
# logs/artifact downloads are not reachable from the agent sandbox.

on:
  workflow_dispatch:
  push:
    branches: [arena/0a9fee00-apex-rush]
    paths:
      - "godot/**"
      - ".github/workflows/android.yml"

env:
  GODOT_VERSION: "4.4.1"

permissions:
  contents: write

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch Godot
        run: |
          curl -sSL -o godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv "Godot_v${GODOT_VERSION}-stable_linux.x86_64" godot-bin
          chmod +x godot-bin
          ./godot-bin --version

      - name: Import project
        run: |
          set +e
          timeout 300 ./godot-bin --headless --path godot --editor --quit > import.log 2>&1
          echo "import exit: $?"
          tail -40 import.log

      - name: Headless smoke test
        run: |
          set +e
          timeout 240 ./godot-bin --headless --path godot --quit-after 420 -- --autotest > run.log 2>&1
          echo "run exit: $?"
          echo "----- engine output -----"
          cat run.log
          echo "----- suspicious lines -----"
          grep -nE "SCRIPT ERROR|Parse Error|Invalid (get|set|call|index)|Nonexistent function|Cannot (call|find|open)" run.log || echo "none found"

      - name: Install export templates
        run: |
          curl -sSL -o templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates"
          unzip -q templates.tpz -d /tmp/tpl
          mv /tmp/tpl/templates "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          ls "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" | head -20

      - name: Configure Android SDK, JDK 17 and debug keystore
        run: |
          echo "--- jvms ---"; ls /usr/lib/jvm || true
          JAVA17=""
          for d in /usr/lib/jvm/*17*; do
            if [ -x "$d/bin/java" ]; then JAVA17="$d"; break; fi
          done
          if [ -z "$JAVA17" ]; then
            echo "no JDK 17 found, installing"
            sudo apt-get update -qq
            sudo apt-get install -y -qq openjdk-17-jdk-headless
            for d in /usr/lib/jvm/*17*; do
              if [ -x "$d/bin/java" ]; then JAVA17="$d"; break; fi
            done
          fi
          echo "JAVA17=$JAVA17"
          export JAVA_HOME="$JAVA17"
          "$JAVA17/bin/java" -version
          keytool -genkeypair -v -keystore "$HOME/debug.keystore" -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          mkdir -p "$HOME/.config/godot"
          {
            echo '[gd_resource type="EditorSettings" format=3]'
            echo ''
            echo '[resource]'
            echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            echo "export/android/java_sdk_path = \"$JAVA17\""
            echo "export/android/debug_keystore = \"$HOME/debug.keystore\""
            echo 'export/android/debug_keystore_user = "androiddebugkey"'
            echo 'export/android/debug_keystore_pass = "android"'
          } > "$HOME/.config/godot/editor_settings-4.tres"
          cp "$HOME/.config/godot/editor_settings-4.tres" "$HOME/.config/godot/editor_settings-4.4.tres"
          cat "$HOME/.config/godot/editor_settings-4.tres"

      - name: Export debug APK
        run: |
          mkdir -p godot/build
          set +e
          ./godot-bin --headless --verbose --path godot --export-debug "Android" "$PWD/godot/build/apex-rush-debug.apk" > export.log 2>&1
          echo "export exit: $?"
          echo "----- export.log (full) -----"
          cat export.log
          ls -la godot/build || true

      - name: Export Windows build
        run: |
          set +e
          mkdir -p godot/build
          ./godot-bin --headless --path godot --export-release "Windows Desktop" "$PWD/godot/build/apex-rush.exe" > export_win.log 2>&1
          echo "windows export exit: $?"
          tail -30 export_win.log
          ls -la godot/build || true
          # the zip must explain itself if the game still fails to start on a PC
          printf '@echo off\r\ncd /d "%%~dp0"\r\necho Starting Apex Rush (OpenGL) with full diagnostics...\r\necho.\r\napex-rush.exe --verbose\r\necho.\r\necho ------------------------------------------------------------\r\necho Exit code: %%errorlevel%%\r\necho If the game closed, copy the text above and send it back.\r\necho A log is also written to: %%APPDATA%%\\Godot\\app_userdata\\Apex Rush - Godot Slice\\logs\\godot.log\r\necho ------------------------------------------------------------\r\npause\r\n' > godot/build/run-windows.bat
          printf '@echo off\r\ncd /d "%%~dp0"\r\necho Starting Apex Rush with the Vulkan (Forward+) renderer...\r\ncd /d "%%~dp0"\r\napex-rush.exe --rendering-method forward_plus --verbose\r\necho.\r\necho Exit code: %%errorlevel%%\r\npause\r\n' > godot/build/run-forward-plus.bat
          cat > godot/build/READ-ME-FIRST.txt <<'TXT'
APEX RUSH - Windows build
=========================

1. Extract the whole zip to a normal folder (not inside the zip preview).
2. Double-click apex-rush.exe

If the window closes immediately, double-click run-windows.bat instead.
It keeps a console open and prints exactly why the game stopped, and gives
you a log file to send back:

  %APPDATA%\Godot\app_userdata\Apex Rush - Godot Slice\logs\godot.log

Controls
--------
W / Up ......... accelerate
S / Down ....... brake, then reverse
A D / Left Right  steer
Space .......... handbrake
Shift .......... nitro
Esc or P ....... pause
R .............. reset car
C .............. camera
L / M .......... audio

This build uses the OpenGL renderer for maximum compatibility.
On a machine with a good GPU, run-forward-plus.bat switches to Vulkan.

Requires 64-bit Windows 10 or newer.
TXT
          ls -la godot/build

      - name: Export Linux build and boot the exported binary
        run: |
          set +e
          for preset in "Linux" "Linux/X11"; do
            if [ ! -f godot/build/apex-rush.x86_64 ]; then
              ./godot-bin --headless --path godot --export-release "$preset" "$PWD/godot/build/apex-rush.x86_64" >> export_linux.log 2>&1
              echo "linux export with preset '$preset' exit: $?"
            fi
          done
          tail -5 export_linux.log
          if [ -f godot/build/apex-rush.x86_64 ]; then
            chmod +x godot/build/apex-rush.x86_64
            timeout 90 ./godot/build/apex-rush.x86_64 --headless --quit-after 180 > boot.log 2>&1
            echo "exported binary boot exit: $?"
            cat boot.log
          else
            echo "no linux binary produced" > boot.log
            cat boot.log
          fi

      - name: Publish APK and logs to branch
        if: always()
        run: |
          mkdir -p .ci-builds
          {
            echo "run: $GITHUB_RUN_ID"
            echo "date: $(date -u)"
            echo "godot: $(./godot-bin --version 2>&1)"
            echo "ANDROID_HOME=$ANDROID_HOME"
            echo "java: $(java -version 2>&1 | head -1)"
            echo "--- templates ---"
            ls -la "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable" 2>&1 | head -30
            echo "--- sdk ---"
            ls "$ANDROID_HOME" 2>&1
            echo "--- platforms ---"
            ls "$ANDROID_HOME/platforms" 2>&1
            echo "--- jvms ---"
            ls /usr/lib/jvm 2>&1
            echo "--- build-tools ---"
            ls "$ANDROID_HOME/build-tools" 2>&1
            echo "--- project build dir ---"
            ls -la godot/build 2>&1
            echo "--- apk anywhere ---"
            find "$PWD" -name "*.apk" -size +1k 2>/dev/null | head
          } > .ci-builds/env.txt 2>&1
          cp run.log import.log export.log .ci-builds/ 2>/dev/null || true
          cp export_win.log export_linux.log boot.log .ci-builds/ 2>/dev/null || true
          # a PC build, so the game can be opened by double-clicking an .exe
          if ls godot/build/*.exe >/dev/null 2>&1; then
            rm -f .ci-builds/apex-rush-windows.zip
            ( cd godot/build && zip -q -9 "$OLDPWD/.ci-builds/apex-rush-windows.zip" apex-rush.exe run-windows.bat run-forward-plus.bat READ-ME-FIRST.txt )
            size=$(stat -c%s .ci-builds/apex-rush-windows.zip)
            echo "windows zip size: $size"
            if [ "$size" -ge 90000000 ]; then
              rm -f .ci-builds/apex-rush-windows.zip
              echo "windows zip too large to commit: $size bytes" >> .ci-builds/env.txt
            fi
          fi
          if ls godot/build/*.apk >/dev/null 2>&1; then
            size=$(stat -c%s godot/build/apex-rush-debug.apk)
            echo "apk size: $size"
            if [ "$size" -lt 90000000 ]; then
              cp godot/build/apex-rush-debug.apk .ci-builds/
            else
              echo "APK too large to commit: $size bytes" >> .ci-builds/env.txt
            fi
          fi
          git config user.name "apex-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -f .ci-builds
          if git diff --cached --quiet; then
            echo "nothing to publish"
          else
            git commit -m "ci: publish build artifacts and logs [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      # Runs last and on purpose: the logs are already on the branch by now, but a
      # build that produced GDScript errors must never be presented as a good APK.
      - name: Verify headless log is clean
        run: |
          if grep -nE "SCRIPT ERROR|Parse Error|Nonexistent function|Invalid call" run.log; then
            echo "::error::GDScript errors in the headless run - build rejected"
            exit 1
          fi
          # a build you cannot tap is not shippable; the autotest proves both surfaces
          if grep -nE "MENU DOES NOT RESPOND|PADS DO NOT RESPOND|TAP PROBE FAILED|MENU IS TAPPABLE|PADS RESPOND TO TOUCH" run.log | grep -qE "DOES NOT RESPOND|FAILED"; then
            echo "::error::touch input is not working - build rejected"
            exit 1
          fi
          grep -q "MENU IS TAPPABLE" run.log || { echo "::error::menu tap probe did not run"; exit 1; }
          grep -q "PADS RESPOND TO TOUCH" run.log || { echo "::error::driving pad probe did not run"; exit 1; }
          if grep -q "ROWS OFF SCREEN" run.log; then
            echo "::error::menu rows fall outside the viewport - build rejected"
            exit 1
          fi
          grep -q "ALL ROWS ON SCREEN" run.log || { echo "::error::layout probe did not run"; exit 1; }
          # the packaged artifact must boot, not just the project in the editor
          if grep -qE "SCRIPT ERROR|Parse Error|Cannot open|does not exist" boot.log 2>/dev/null; then
            echo "::error::the exported binary failed to boot"
            exit 1
          fi
          echo "headless log clean, menu and pads respond to touch"

      - name: Upload APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apex-rush-debug-apk
          path: godot/build/*.apk
          if-no-files-found: warn
          retention-days: 14
